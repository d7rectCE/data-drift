[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "driftfdr"
version = "0.1.0"
description = "Calibrated p-values and multiplicity control on top of practical drift detectors for monitoring fleets of ML models"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Artem Deviatov"}]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "river>=0.21"]
datasets = ["river>=0.21", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
