# Publishes to PyPI when a GitHub release is published, with PyPI's trusted publishing
# (no token in the repository). One-time setup on pypi.org: add a trusted publisher for
# this repository with workflow "publish.yml" and environment "pypi". See CONTRIBUTING.md.
name: publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
